projects:
  - id: vlm-hallucination
    type: vlm-hallucination
    title: "Multimodal Large Language Models & Reinforcement Learning"
    description: >-
      <span class="viz-project__lead">Test-Time Training (TTT) for Cross-Modal Generation and MLLMs [[GitHub](https://github.com/feizhao19/VisionGuard)]:</span>
      An inference-time RL training framework that addresses **data distribution shift** and **hallucination** in cross-modal generation.
      Proposed in 2024, it optimizes candidate responses by their relative quality rather than absolute reward values, preceding the widespread adoption of similar relative-ranking RL methods (e.g., GRPO).
      We further diagnosed a **reward-hacking** gap: CLIP's alignment score still rewarded mostly correct captions containing a single localized hallucination.
      **To close it**, we built **12M+ synthetic caption pairs**, each pairing a correct caption with a hallucination-injected variant, to **contrastively train an NHP verifier** on top of frozen CLIP.
      Combined with the CLIP score, the NHP signal makes the reward catch fine-grained hallucinations and harder to game, reducing hallucinations by 4.8% over CLIP score alone.
 
  - id: building-damage
    anchor: RapidDamageAssessment
    legacy_ids:
      - project-building-damage
    title: "Computer Vision & Contrastive Representation Learning"
    description: >-
      <span class="viz-project__lead">Visual Prompt Learning of Foundation Models for Damage Evaluation [[GitHub](https://github.com/feizhao19/RapidDamageAssessment)]:</span>
      Given paired pre- and post-disaster imagery, we adapt Meta's Segment Anything Model (**SAM**) using **soft prompt tuning** to learn contrastive representations for building damage assessment. The inference pipeline is cross-platform optimized for **heterogeneous GPU architectures** (NVIDIA CUDA / Apple MPS).
      Below is an interactive showcase of our work ViPDE [[GitHub](https://github.com/feizhao19/RapidDamageAssessment)], supporting 11 types of natural disasters. Drag the slider to compare pre- and post-disaster imagery (top) with the predicted damage map (bottom). Use the buttons to switch between sample communities.
