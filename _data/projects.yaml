  - id: rapid-response-agent
    anchor: RapidResponseAgent
    legacy_ids:
      - project-geo-agent
    type: geo-agent
    title: "Multimodal AI Agent"
    youtube_id: FHo7Og4VCOg
    youtube_aspect_ratio: "1920/954"
    description: >-
      <span class="viz-project__lead">RapidResponseAgent [[GitHub](https://github.com/feizhao19/RapidResponseAgent)]</span>
      Given a text request, an image, or both, it assesses building damage in satellite imagery, verifies its own findings, links them to nearby facilities, and generates decision-ready reports for emergency response teams.
      A **fully local**, interactive multimodal **AI agent** built on open-weight models, it coordinates GPU-heavy visual perception [[GitHub](https://github.com/feizhao19/RapidDamageAssessment)], VLM-based (e.g., LLaMA) **verification and reasoning refined with DPO**, damage analytics, and RAG retrieval through persistent session memory and tool traces. Decoupling heavy inference from lightweight follow-up analysis enables reliable multi-turn Q&amp;A over cached results while keeping sensitive imagery on-premises.
      
    preview_caption: "Demo walkthrough of the RapidResponseAgent dashboard."

  - id: attitude-fusion
    type: attitude-fusion
    title: "Vehicle State and Trajectory Estimation"
    description: >-
      <span class="viz-project__lead">Multimodal sensor fusion and calibration for attitude state estimation:</span>
      Combines gyroscope, accelerometer, and magnetometer measurements for real-time vehicle attitude estimation, enabling accurate trajectory estimation while mitigating long-term drift.
